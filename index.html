<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ResumeRX – ATS Keyword Optimizer | Beat the Resume Scanner</title>
    <meta name="description" content="Paste a job description and your resume bullets. AI finds missing keywords and rewrites your experience to pass ATS filters. Free tool.">
    <meta property="og:title" content="ResumeRX – ATS Keyword Optimizer">
    <meta property="og:description" content="Beat the resume scanner with AI-powered keyword extraction and bullet rewrites.">

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>

    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: linear-gradient(135deg, #0b1120, #1a2a3a, #0f172a);
            font-family: system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            padding: 2rem 1rem;
            color: #e2e8f0;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border-radius: 32px;
            padding: 2rem;
            border: 1px solid rgba(255,255,255,0.1);
        }
        h1 { font-size: 2.5rem; text-align:center; background: linear-gradient(135deg,#fff,#60a5fa); -webkit-background-clip:text; color:transparent; margin-bottom:0.5rem; }
        .sub { text-align:center; color:#94a3b8; margin-bottom:2rem; }
        label { display:block; margin:1.2rem 0 0.5rem; font-weight:bold; color:#cbd5e1; }
        textarea {
            width:100%; background:rgba(0,0,0,0.6); border:1px solid rgba(255,255,255,0.2);
            border-radius:24px; padding:1rem; color:white; font-size:0.95rem; resize:vertical; font-family: inherit;
        }
        textarea:focus { border-color:#60a5fa; box-shadow:0 0 12px rgba(96,165,250,0.4); }
        .char-counter { text-align:right; font-size:0.8rem; color:#94a3b8; margin-top:4px; }
        .action-buttons { display:flex; gap:1rem; margin:1.5rem 0; flex-wrap:wrap; }
        button {
            background: linear-gradient(90deg, #3b82f6, #60a5fa);
            border:none; border-radius:40px; padding:14px 28px; font-weight:bold;
            color:white; cursor:pointer; flex:1; min-width:160px;
        }
        button.secondary { background:rgba(255,255,255,0.15); }
        button:hover:not(:disabled) { transform:scale(0.97); }
        button:disabled { opacity:0.5; cursor:not-allowed; }
        .result {
            margin-top:2rem; background:rgba(0,0,0,0.5); border-radius:24px;
            padding:1.8rem; border-left:5px solid #60a5fa; display:none;
        }
        .loading { display:none; text-align:center; margin:2rem 0; }
        .loading.active { display:block; }
        .spinner { width:48px; height:48px; border:5px solid rgba(255,255,255,0.2); border-top-color:#60a5fa; border-radius:50%; animation:spin 0.8s linear infinite; margin:0 auto; }
        @keyframes spin { to { transform:rotate(360deg); } }
        .error { background:rgba(255,0,0,0.15); color:#ff9999; padding:1rem; border-radius:20px; }
        .toast { position:fixed; bottom:30px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,0.9); color:white; padding:12px 28px; border-radius:50px; z-index:10000; opacity:0; transition:opacity .3s; }
        .toast.show { opacity:1; }
        footer { text-align:center; margin-top:2rem; font-size:0.8rem; color:#64748b; }
        @media (max-width:600px) { .container { padding:1.5rem; } h1 { font-size:1.9rem; } }
    </style>
</head>
<body>
<div class="container">
    <h1>📄 ResumeRX</h1>
    <div class="sub">Beat the ATS scanner – AI keyword optimizer for your resume</div>

    <label>📌 Job Description</label>
    <textarea id="jdInput" rows="6" placeholder="Paste the full job description here..."></textarea>
    <div class="char-counter"><span id="jdCount">0</span>/3500</div>

    <label>✍️ Your Resume Bullet Points</label>
    <textarea id="resumeInput" rows="8" placeholder="Paste your experience bullets (one per line)..."></textarea>
    <div class="char-counter"><span id="resumeCount">0</span>/3500</div>

    <div class="action-buttons">
        <button id="analyzeBtn">🔍 Extract Keywords & Rewrite Bullets</button>
        <button id="clearBtn" class="secondary">🗑️ Clear All</button>
    </div>

    <div class="loading" id="loading">
        <div class="spinner"></div>
        <p>Optimizing your resume with Gemini AI...</p>
    </div>

    <div id="result" class="result"></div>
    
    <div style="display:flex; gap:1rem; margin-top:1rem; flex-wrap:wrap;">
        <button id="copyBtn" style="display:none;" class="secondary">📋 Copy Full Results</button>
        <button id="copyKeywordsBtn" style="display:none;" class="secondary">🔑 Copy Keywords Only</button>
    </div>

    <footer>⚡ Free tool • Data not stored • Powered by Gemini</footer>
</div>

<div id="toast" class="toast"></div>

<script>
    const jdInput = document.getElementById('jdInput');
    const resumeInput = document.getElementById('resumeInput');
    const analyzeBtn = document.getElementById('analyzeBtn');
    const clearBtn = document.getElementById('clearBtn');
    const copyBtn = document.getElementById('copyBtn');
    const copyKeywordsBtn = document.getElementById('copyKeywordsBtn');
    const resultDiv = document.getElementById('result');
    const loadingDiv = document.getElementById('loading');
    const toastEl = document.getElementById('toast');
    const jdCount = document.getElementById('jdCount');
    const resumeCount = document.getElementById('resumeCount');

    function showToast(msg) {
        toastEl.textContent = msg;
        toastEl.classList.add('show');
        setTimeout(() => toastEl.classList.remove('show'), 2500);
    }

    // Character counters
    jdInput.addEventListener('input', () => jdCount.textContent = jdInput.value.length);
    resumeInput.addEventListener('input', () => resumeCount.textContent = resumeInput.value.length);

    clearBtn.addEventListener('click', () => {
        jdInput.value = resumeInput.value = '';
        jdCount.textContent = resumeCount.textContent = '0';
        resultDiv.style.display = 'none';
        copyBtn.style.display = 'none';
        copyKeywordsBtn.style.display = 'none';
        showToast('Cleared');
    });

    copyBtn.addEventListener('click', () => {
        navigator.clipboard.writeText(resultDiv.innerText).then(() => showToast('✅ Full results copied!'));
    });

    copyKeywordsBtn.addEventListener('click', () => {
        const keywordsSection = resultDiv.querySelector('h2, strong') ? 
            resultDiv.innerText.split('\n').filter(line => line.includes('**Missing Keywords**') || line.includes('Missing Keywords')).join('\n') : 
            resultDiv.innerText;
        navigator.clipboard.writeText(keywordsSection).then(() => showToast('🔑 Keywords copied!'));
    });

    analyzeBtn.addEventListener('click', async () => {
        const jd = jdInput.value.trim();
        const resume = resumeInput.value.trim();

        if (!jd || !resume) {
            showToast('Please paste both Job Description and Resume bullets');
            return;
        }

        analyzeBtn.disabled = true;
        loadingDiv.classList.add('active');
        resultDiv.style.display = 'none';
        copyBtn.style.display = 'none';
        copyKeywordsBtn.style.display = 'none';

        try {
            const res = await fetch('/api/optimize', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ jobDescription: jd, resumeBullets: resume })
            });

            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'Server error');

            const safeHtml = DOMPurify.sanitize(marked.parse(data.analysis));
            resultDiv.innerHTML = `<h3>🎯 ATS Optimization Results</h3>${safeHtml}`;
            resultDiv.style.display = 'block';
            copyBtn.style.display = 'inline-block';
            copyKeywordsBtn.style.display = 'inline-block';
            showToast('Optimization complete!');
        } catch (err) {
            resultDiv.innerHTML = `<div class="error">❌ ${err.message}</div>`;
            resultDiv.style.display = 'block';
            showToast('Request failed');
        } finally {
            analyzeBtn.disabled = false;
            loadingDiv.classList.remove('active');
        }
    });
</script>
</body>
</html>
