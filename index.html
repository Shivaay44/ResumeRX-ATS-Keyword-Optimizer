<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ResumeRX — Premium ATS Optimizer</title>
    <meta name="description" content="AI-Powered Resume Optimization to Beat ATS Systems">
    
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap');
        
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: linear-gradient(135deg, #0a0f1c 0%, #1e2937 100%);
            font-family: 'Inter', system-ui, sans-serif;
            min-height: 100vh;
            color: #e2e8f0;
            padding: 2rem 1rem;
            line-height: 1.6;
        }
        .container {
            max-width: 1120px;
            margin: 0 auto;
            background: rgba(15, 23, 42, 0.96);
            backdrop-filter: blur(20px);
            border-radius: 32px;
            border: 1px solid rgba(148, 163, 184, 0.2);
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.6);
            overflow: hidden;
        }
        header {
            background: linear-gradient(135deg, #1e40af, #3b82f6);
            padding: 4rem 2rem 3rem;
            text-align: center;
            position: relative;
        }
        header::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
        }
        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 3.2rem;
            font-weight: 700;
            background: linear-gradient(90deg, #ffffff, #bae6fd);
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 0.5rem;
        }
        .tagline {
            font-size: 1.25rem;
            color: #bae6fd;
            opacity: 0.95;
        }
        .main-content {
            padding: 3rem 3rem 2.5rem;
        }
        .input-section {
            margin-bottom: 2.5rem;
        }
        label {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            font-weight: 600;
            color: #cbd5e1;
            font-size: 1.1rem;
        }
        textarea {
            width: 100%;
            background: rgba(0, 0, 0, 0.45);
            border: 2px solid rgba(148, 163, 184, 0.25);
            border-radius: 20px;
            padding: 1.4rem;
            color: #f1f5f9;
            font-size: 1rem;
            resize: vertical;
            min-height: 160px;
            transition: all 0.4s ease;
        }
        textarea:focus {
            border-color: #60a5fa;
            box-shadow: 0 0 0 4px rgba(96, 165, 250, 0.15);
        }
        .char-counter {
            text-align: right;
            font-size: 0.85rem;
            color: #64748b;
            margin-top: 8px;
        }
        .action-buttons {
            display: flex;
            gap: 1.2rem;
            margin: 2.5rem 0;
            flex-wrap: wrap;
        }
        button {
            padding: 16px 36px;
            font-weight: 600;
            border-radius: 9999px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 1.05rem;
        }
        #analyzeBtn {
            background: linear-gradient(90deg, #2563eb, #3b82f6, #60a5fa);
            border: none;
            color: white;
            flex: 1;
            min-width: 260px;
            box-shadow: 0 10px 25px rgba(37, 99, 235, 0.3);
        }
        #analyzeBtn:hover:not(:disabled) {
            transform: translateY(-4px);
            box-shadow: 0 20px 35px rgba(37, 99, 235, 0.4);
        }
        .secondary {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(148,163,184,0.4);
            color: #e2e8f0;
        }
        .result {
            margin-top: 2.5rem;
            background: rgba(0,0,0,0.35);
            border-radius: 24px;
            padding: 2.2rem;
            border-left: 6px solid #60a5fa;
            display: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .loading {
            display: none;
            text-align: center;
            margin: 4rem 0;
        }
        .loading.active { display: block; }
        .spinner {
            width: 64px; height: 64px;
            border: 6px solid rgba(255,255,255,0.1);
            border-top-color: #60a5fa;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            margin: 0 auto 1.2rem;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .error {
            background: rgba(248, 113, 113, 0.15);
            color: #fda4af;
            padding: 1.5rem;
            border-radius: 20px;
            border-left: 5px solid #f87171;
        }
        .toast {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e2937;
            color: white;
            padding: 16px 32px;
            border-radius: 9999px;
            z-index: 10000;
            opacity: 0;
            transition: all 0.4s;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        .toast.show { opacity: 1; }
        footer {
            text-align: center;
            padding: 2rem;
            color: #64748b;
            font-size: 0.9rem;
        }
        @media (max-width: 640px) {
            h1 { font-size: 2.4rem; }
            .main-content { padding: 2rem 1.5rem; }
        }
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1>ResumeRX</h1>
        <div class="tagline">AI-Powered ATS Resume Optimizer</div>
    </header>

    <div class="main-content">
        <div class="input-section">
            <label>📌 Job Description</label>
            <textarea id="jdInput" rows="6" placeholder="Paste the full job description here..."></textarea>
            <div class="char-counter"><span id="jdCount">0</span>/3500 characters</div>
        </div>

        <div class="input-section">
            <label>✍️ Your Resume Bullet Points</label>
            <textarea id="resumeInput" rows="8" placeholder="Paste your experience bullets (one per line)..."></textarea>
            <div class="char-counter"><span id="resumeCount">0</span>/3500 characters</div>
        </div>

        <div class="action-buttons">
            <button id="analyzeBtn">🔍 Optimize Resume for ATS</button>
            <button id="clearBtn" class="secondary">🗑️ Clear All</button>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Consulting AI Resume Expert...</p>
        </div>

        <div id="result" class="result"></div>

        <div style="display:flex; gap:1rem; margin-top:1.8rem; flex-wrap:wrap;">
            <button id="copyBtn" style="display:none;" class="secondary">📋 Copy Full Analysis</button>
            <button id="copyKeywordsBtn" style="display:none;" class="secondary">🔑 Copy Missing Keywords</button>
        </div>
    </div>

    <footer>
        Free • Secure • Powered by Google Gemini • Made for ambitious professionals
    </footer>
</div>

<div id="toast" class="toast"></div>

<script>
    const jdInput = document.getElementById('jdInput');
    const resumeInput = document.getElementById('resumeInput');
    const analyzeBtn = document.getElementById('analyzeBtn');
    const clearBtn = document.getElementById('clearBtn');
    const copyBtn = document.getElementById('copyBtn');
    const copyKeywordsBtn = document.getElementById('copyKeywordsBtn');
    const resultDiv = document.getElementById('result');
    const loadingDiv = document.getElementById('loading');
    const toastEl = document.getElementById('toast');
    const jdCount = document.getElementById('jdCount');
    const resumeCount = document.getElementById('resumeCount');

    function showToast(msg) {
        toastEl.textContent = msg;
        toastEl.classList.add('show');
        setTimeout(() => toastEl.classList.remove('show'), 2800);
    }

    jdInput.addEventListener('input', () => jdCount.textContent = jdInput.value.length);
    resumeInput.addEventListener('input', () => resumeCount.textContent = resumeInput.value.length);

    clearBtn.addEventListener('click', () => {
        jdInput.value = resumeInput.value = '';
        jdCount.textContent = resumeCount.textContent = '0';
        resultDiv.style.display = 'none';
        copyBtn.style.display = 'none';
        copyKeywordsBtn.style.display = 'none';
        showToast('All fields cleared');
    });

    copyBtn.addEventListener('click', () => {
        navigator.clipboard.writeText(resultDiv.innerText).then(() => showToast('✅ Full analysis copied'));
    });

    copyKeywordsBtn.addEventListener('click', () => {
        const text = resultDiv.innerText;
        const start = text.indexOf('Missing Keywords') || 0;
        const end = text.indexOf('Optimized Bullet Points') || text.length;
        const keywords = text.substring(start, end);
        navigator.clipboard.writeText(keywords).then(() => showToast('🔑 Keywords copied'));
    });

    analyzeBtn.addEventListener('click', async () => {
        const jd = jdInput.value.trim();
        const resume = resumeInput.value.trim();

        if (!jd || !resume) {
            showToast('Please fill both fields');
            return;
        }

        analyzeBtn.disabled = true;
        loadingDiv.classList.add('active');
        resultDiv.style.display = 'none';
        copyBtn.style.display = 'none';
        copyKeywordsBtn.style.display = 'none';

        try {
            const res = await fetch('/api/optimize', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ jobDescription: jd, resumeBullets: resume })
            });

            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'Server error');

            const safeHtml = DOMPurify.sanitize(marked.parse(data.analysis));
            resultDiv.innerHTML = `<h3 style="color:#60a5fa; margin-bottom:1.2rem;">🎯 Your ATS-Optimized Results</h3>${safeHtml}`;
            resultDiv.style.display = 'block';
            copyBtn.style.display = 'inline-block';
            copyKeywordsBtn.style.display = 'inline-block';
            showToast('✅ Resume optimized successfully!');
        } catch (err) {
            resultDiv.innerHTML = `<div class="error">❌ ${err.message}</div>`;
            resultDiv.style.display = 'block';
            showToast('Error occurred');
        } finally {
            analyzeBtn.disabled = false;
            loadingDiv.classList.remove('active');
        }
    });
</script>
</body>
</html>
